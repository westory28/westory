    <style>
      /* Boot logo until React mounts. Same letter clips, bounce and colour fill as
         the shared loading logo (LoadingLogo.tsx, loadingState.css); by explicit
         owner decision it also keeps moving under reduced motion. */
      .ws-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f9fafb;
      }
      .ws-boot__logo {
        display: block;
        width: 288px;
        max-width: calc(100% - 32px);
        height: auto;
        overflow: visible;
      }
      .ws-boot__ghost {
        opacity: 0.18;
        filter: grayscale(1);
      }
      .ws-boot__letter {
        animation: ws-boot-bounce 1400ms ease-in-out infinite;
      }
      .ws-boot__fill {
        transform-origin: 0 0;
        animation: ws-boot-fill 30000ms linear both;
      }
      @keyframes ws-boot-bounce {
        0%,
        45%,
        100% {
          transform: translateY(0);
        }
        16% {
          transform: translateY(-28px);
        }
        30% {
          transform: translateY(5px);
        }
        38% {
          transform: translateY(-5px);
        }
      }
      @keyframes ws-boot-fill {
        0% {
          transform: scaleX(0);
        }
        5% {
          transform: scaleX(0.32);
        }
        15% {
          transform: scaleX(0.58);
        }
        35% {
          transform: scaleX(0.78);
        }
        65% {
          transform: scaleX(0.89);
        }
        100% {
          transform: scaleX(0.94);
        }
      }
    </style>
  </head>
