<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest?v=20261105" />
    <style>
      /* This surface must be present before the app or its external styles load. */
      html {
        --ws-safe-top: env(safe-area-inset-top, 0px);
        --ws-status-surface: 249 250 251;
        background-color: #f9fafb;
        scroll-padding-top: var(--ws-safe-top);
      }
      :is(html, dialog:modal, :fullscreen)::after {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        z-index: 11001;
        height: var(--ws-safe-top);
        pointer-events: none;
        background: rgb(var(--ws-status-surface));
        -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 8px), transparent);
        mask-image: linear-gradient(to bottom, black calc(100% - 8px), transparent);
      }
      @supports ((-webkit-backdrop-filter: blur(12px)) or (backdrop-filter: blur(12px))) {
        :is(html, dialog:modal, :fullscreen)::after {
          background: rgb(var(--ws-status-surface) / 76%);
          -webkit-backdrop-filter: blur(12px);
          backdrop-filter: blur(12px);
        }
      }
      /* A native modal paints above the document, including its backdrop. */
      html:has(dialog:modal, :fullscreen)::after { content: none; }
      @supports (-webkit-touch-callout: none) {
        @media (display-mode: standalone) {
          html { --ws-status-surface: 31 41 55; }
        }
      }
    </style>
    <link
      rel="icon"
      type="image/x-icon"
      sizes="16x16 32x32 48x48"
      href="/favicon.ico?v=20261025"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/westory-favicon-16.png?v=20261025"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/westory-favicon-32.png?v=20261025"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/westory-icon-180.png?v=20261025"
    />
    <title>위스토리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div id="root"></div>
    <noscript>위스토리는 JavaScript가 필요합니다.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
