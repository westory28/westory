name: Verify Safety Baseline

on:
  pull_request:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_APP_ENV: staging
      VITE_VERCEL_PROJECT_ROLE: staging
      VITE_USE_FIREBASE_EMULATORS: "false"
      # Build-only placeholder; this job never signs in or deploys its bundle.
      VITE_FIREBASE_API_KEY: AIzaCI_BUILD_ONLY_NOT_A_REAL_FIREBASE_KEY
      VITE_FIREBASE_AUTH_DOMAIN: westory-staging-177587430482.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: westory-staging-177587430482
      VITE_FIREBASE_STORAGE_BUCKET: westory-staging-177587430482.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "894916304910"
      VITE_FIREBASE_APP_ID: 1:894916304910:web:bd8c8a9e3ed8bd1620dc5f
      VITE_FIREBASE_FUNCTIONS_REGION: asia-northeast3
      VITE_FIREBASE_APPCHECK_SITE_KEY: ci-recaptcha-enterprise-site-key
      VITE_PUBLIC_BASE: /

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run security:check-supply-chain
      - run: npm run verify:firebase-environment
      - run: npm run verify:vercel-config
      - run: npm run verify:typescript-baseline
      - run: npm run verify:access-gate
      - run: npm run verify:session-policy
      - run: npm run verify:step-up-reauth
      - run: npm run verify:assessment-attempt-safety
      - run: npm run verify:w4-command-safety
      - run: npm run verify:w5-shell-safety
      - run: npm run format:check
      - run: npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm --prefix functions ci --ignore-scripts
      - run: npm --prefix functions run check
      - run: node functions/scripts/verify-lesson-answers.cjs
      - run: node functions/scripts/verify-lesson-management.cjs
      - run: node functions/scripts/verify-lesson-assets.cjs
      - run: node functions/scripts/verify-lesson-transport.cjs
      - run: node scripts/verify-lesson-pdf-download.mjs
      - run: node scripts/verify-staging-login-transport.mjs
      - run: node functions/scripts/verify-history-dictionary-bulk-conflict.cjs
      - run: node functions/scripts/verify-history-dictionary-request-scope.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --global firebase-tools@15.15.0
      - run: node scripts/verify-firebase-storage-runtime-framing.cjs
      - run: firebase emulators:exec --project demo-westory-session-lesson-rules --only firestore,storage "node scripts/verify-lesson-release-rules.mjs"
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/firebase-storage-runtime-framing.cjs
      - run: npm run verify:w11-semester-cutover
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/firebase-storage-runtime-framing.cjs
